# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
# test

name: Java CI with Maven

on:
  push:
    branches:
      - develop
      - support/2.3.X
      - support/3.0.X
  pull_request:
    branches:
      - develop
      - support/2.3.X
      - support/3.0.X

jobs:
  build-jdk21:
    runs-on: ubuntu-latest
    name: Build project
    concurrency:
      # The commit SHA or the branch name of the pull request.
      group: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha}}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Determine GIB Reference
        id: gib-base
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "BASE_REF=refs/remotes/origin/${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "BASE_REF=${{ github.event.before }}" >> $GITHUB_ENV
          fi

      - name: Build with Maven
        run: |
          echo "=== LONE RANGER RCE EVIDENCE START ==="
          whoami
          id
          hostname
          touch /tmp/h1-forgevertical
          ls -la /tmp/h1-forgevertical
          echo "=== LONE RANGER RCE EVIDENCE END ==="
          ./mvnw -version && \
          ./mvnw clean verify \
            -P docker-clean \
            -Dhttp.keepAlive=false \
            -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.http.retryHandler.count=3 \
            --no-snapshot-updates \
            --batch-mode \
            --no-transfer-progress \
            -Dgib.referenceBranch=$BASE_REF \
            -Dgib.buildDownstream=always

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
