spring:
  output:
    ansi:
      enabled: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${embedded.keycloak.host}:${embedded.keycloak.http-port}/realms/${testing.keycloak.realm}/protocol/openid-connect/certs

logging:
  level:
    com.playtika.testcontainer: info
    org.springframework.boot: info
    org.springframework.security: info
    org.keycloak: info
    root: error
