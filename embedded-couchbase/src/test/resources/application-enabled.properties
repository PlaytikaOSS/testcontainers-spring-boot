spring.couchbase.connection-string=couchbase://${embedded.couchbase.host:localhost}:${embedded.couchbase.bootstrapCarrierDirectPort:11210}=kv,${embedded.couchbase.host:localhost}:${embedded.couchbase.toxiproxy.port:8091}=manager
spring.couchbase.username=${embedded.couchbase.user:Administrator}
spring.couchbase.password=${embedded.couchbase.password:password}
spring.couchbase.env.timeouts.connect=20s
spring.couchbase.env.timeouts.key-value=20s
spring.data.couchbase.bucket-name=${embedded.couchbase.bucket:test}
spring.data.couchbase.auto-index=true
